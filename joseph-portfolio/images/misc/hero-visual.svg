<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1000" width="860" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="1000" fill="#F6F1E7"/>

  <!-- shapes nudged toward the centre of the frame as a group -->
  <g transform="translate(25,95)">
    <!-- Lyric: circle, bleeding off the top-left corner -->
    <circle cx="300" cy="150" r="230" fill="#F2C230"/>
    <circle cx="300" cy="150" r="230" fill="none" stroke="#16140F" stroke-width="6"/>

    <!-- Epic: triangle, bleeding off the right edge, cutting through the circle -->
    <polygon points="560,20 860,560 340,620" fill="#FF4A1C"/>
    <polygon points="560,20 860,560 340,620" fill="none" stroke="#16140F" stroke-width="6"/>

    <!-- Dramatic: square, bleeding off the left and bottom edges, cutting through both -->
    <rect x="-40" y="340" width="520" height="520" fill="#2C4CD4" transform="rotate(-16 220 600)"/>
    <rect x="-40" y="340" width="520" height="520" fill="none" stroke="#16140F" stroke-width="6" transform="rotate(-16 220 600)"/>
  </g>

  <!-- outer frame, drawn last so it crops the bleed cleanly -->
  <rect x="4" y="4" width="852" height="992" fill="none" stroke="#16140F" stroke-width="8"/>
</svg>
